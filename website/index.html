<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PongPong</title>
<style>
:root{--bg:#07070a;--panel:#111116;--line:#25252e;--text:#f5f5f7;--muted:#8d8d99;--accent:#8b5cf6;--green:#4ade80}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#211044 0,#0b0a10 42%,var(--bg) 75%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:44px 44px;opacity:.025}
.wrap{width:min(1050px,92vw);margin:0 auto;padding:42px 0 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#9b6cff,#5b21b6);font-weight:900;font-size:22px;box-shadow:0 10px 35px #6d28d933}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.online{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid #245e38;background:#0e1d14;border-radius:999px;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.grid{display:grid;grid-template-columns:330px 1fr;gap:20px}.panel{background:#0e0e13dd;border:1px solid var(--line);border-radius:22px;box-shadow:0 25px 70px #0008;backdrop-filter:blur(14px)}.profile{padding:26px;text-align:center}.avatar{width:100px;height:100px;border-radius:28px;margin:2px auto 17px;background:linear-gradient(145deg,#a78bfa,#4c1d95);display:grid;place-items:center;font-size:42px;font-weight:900;box-shadow:0 15px 45px #8b5cf633}.profile h2{margin:0;font-size:27px}.handle{color:var(--muted);font-size:13px;margin-top:5px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:22px}.stat{padding:13px;background:#15151c;border:1px solid #252530;border-radius:14px;text-align:left}.stat b{display:block;font-size:18px}.stat span{color:var(--muted);font-size:11px}.game{padding:25px}.gamehead{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px}.gamehead h2{margin:0;font-size:23px}.gamehead p{margin:5px 0 0;color:var(--muted);font-size:12px}.kbd{font-size:11px;color:#aaa;border:1px solid #30303a;border-bottom-width:2px;border-radius:7px;padding:5px 8px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(420px,100%);margin:0 auto 22px}.tile{aspect-ratio:1;border:1px solid #363640;border-radius:9px;display:grid;place-items:center;font-size:27px;font-weight:800;background:#101017;text-transform:uppercase;transition:.12s}.tile.filled{border-color:#656575}.tile.correct{background:#287044;border-color:#3c9b60}.tile.present{background:#866b24;border-color:#b99535}.tile.wrong{background:#303039;border-color:#41414c}.keyboard{display:grid;gap:7px;max-width:570px;margin:auto}.keyrow{display:flex;justify-content:center;gap:6px}.key{height:43px;min-width:31px;padding:0 8px;border:0;border-radius:8px;background:#24242d;color:#fff;font-weight:700;cursor:pointer}.key:hover{background:#33333e}.key.wide{min-width:58px;font-size:11px}.key.correct{background:#287044}.key.present{background:#866b24}.key.wrong{background:#303039}.message{text-align:center;min-height:20px;color:#aaa;font-size:13px;margin:10px 0}.new{text-align:center}.new button{background:#fff;color:#09090c;border:0;border-radius:9px;padding:9px 15px;font-weight:800;cursor:pointer}.footer{text-align:center;color:#555;font-size:11px;margin-top:22px}@media(max-width:760px){.grid{grid-template-columns:1fr}.profile{padding:22px}.game{padding:19px}.wrap{padding-top:24px}.top{margin-bottom:18px}.kbd{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">P</div><div><h1>PongPong</h1><p>Discord bot • mini games</p></div></div><div class="online"><span class="dot"></span>Online</div></header>
<div class="grid">
<section class="panel profile"><div class="avatar">P</div><h2>PongPong</h2><div class="handle">Your Discord companion</div><div class="stats"><div class="stat"><b id="wins">0</b><span>Wins</span></div><div class="stat"><b id="streak">0</b><span>Streak</span></div></div></section>
<section class="panel game"><div class="gamehead"><div><h2>Infinite Wordle</h2><p>Guess the hidden 5-letter word. New puzzle whenever you finish.</p></div><span class="kbd">5 LETTERS</span></div><div id="board" class="board"></div><div id="message" class="message"></div><div id="keyboard" class="keyboard"></div><div id="new" class="new"></div></section>
</div><div class="footer">PongPong • Infinite Wordle</div>
</div>
<script>
const words=["about","adore","after","again","alert","alien","alone","apple","arena","arise","audio","avoid","badge","basic","beach","begin","below","bench","birth","black","blade","blame","blank","blend","blind","block","blood","board","brain","brave","bread","break","brick","brief","bring","broad","brown","build","candy","carry","cause","chain","chair","charm","chase","cheap","check","chess","chief","child","claim","class","clean","clear","climb","clock","close","cloud","coach","coast","color","count","court","cover","craft","crane","crash","cream","crime","cross","crowd","crown","dance","death","delay","depth","devil","diary","dirty","doubt","dozen","dream","dress","drink","drive","earth","eight","enemy","enjoy","enter","equal","error","event","every","faith","false","fancy","feast","field","fight","final","first","flame","flash","fleet","floor","focus","force","frame","fresh","front","fruit","giant","given","glass","globe","grace","grade","grain","grand","grant","grass","great","green","group","guard","guess","guest","guide","happy","heart","heavy","hello","house","human","ideal","image","index","inner","input","issue","joint","judge","juice","knife","knock","known","label","laugh","layer","learn","least","leave","lemon","level","light","limit","local","magic","major","maker","march","match","maybe","metal","model","money","month","motor","mount","mouse","mouth","movie","music","never","night","noise","north","novel","nurse","ocean","offer","often","order","other","paint","panel","paper","party","peace","phone","photo","piece","pilot","place","plain","plane","plant","plate","point","power","press","price","pride","prime","print","prize","proof","queen","quick","quiet","radio","raise","range","reach","react","ready","right","river","rough","round","route","royal","scale","scene","score","serve","seven","share","sharp","sheep","shift","shine","shirt","short","sight","since","skill","sleep","slice","small","smart","smile","smoke","snake","sound","south","space","spare","speak","speed","spend","spice","sport","stage","stand","start","state","steam","steel","stick","still","stone","store","storm","story","strip","style","sugar","table","taste","teach","thank","theme","thing","think","three","throw","tight","timer","title","today","topic","tower","track","trade","train","treat","trend","trial","tribe","trick","truck","trust","truth","under","union","unite","until","upper","urban","usual","value","video","visit","voice","waste","watch","water","wheel","where","which","while","white","whole","woman","world","worry","write","wrong","young","youth"];
let answer="",row=0,current="",gameOver=false,wins=+localStorage.ppWins||0,streak=+localStorage.ppStreak||0;
const board=document.getElementById("board"),message=document.getElementById("message"),keyboard=document.getElementById("keyboard");
function start(){answer=words[Math.floor(Math.random()*words.length)];row=0;current="";gameOver=false;board.innerHTML="";message.textContent="";document.getElementById("new").innerHTML="";document.getElementById("wins").textContent=wins;document.getElementById("streak").textContent=streak;for(let i=0;i<30;i++){let d=document.createElement("div");d.className="tile";board.appendChild(d)}buildKeys()}
function buildKeys(){keyboard.innerHTML="";["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"].forEach((s,i)=>{let r=document.createElement("div");r.className="keyrow";if(i===2){let e=document.createElement("button");e.className="key wide";e.textContent="ENTER";e.onclick=submit;r.appendChild(e)}for(const c of s){let b=document.createElement("button");b.className="key";b.id="k"+c;b.textContent=c;b.onclick=()=>press(c);r.appendChild(b)}if(i===2){let e=document.createElement("button");e.className="key wide";e.textContent="⌫";e.onclick=back;r.appendChild(e)}keyboard.appendChild(r)})}
function press(c){if(gameOver||current.length>=5)return;current+=c.toLowerCase();render()}
function back(){if(!gameOver){current=current.slice(0,-1);render()}}
function render(){for(let i=0;i<5;i++)board.children[row*5+i].textContent=current[i]||""}
function submit(){if(gameOver)return;if(current.length<5){message.textContent="Enter a 5-letter word.";return}let guess=current;let chars=[...answer],states=Array(5).fill("wrong");for(let i=0;i<5;i++)if(guess[i]===chars[i]){states[i]="correct";chars[i]=null}for(let i=0;i<5;i++)if(states[i]==="wrong"){let j=chars.indexOf(guess[i]);if(j>=0){states[i]="present";chars[j]=null}}for(let i=0;i<5;i++){let t=board.children[row*5+i];t.classList.add(states[i]);let k=document.getElementById("k"+guess[i].toUpperCase());if(states[i]==="correct")k.className="key correct";else if(states[i]==="present"&&!k.classList.contains("correct"))k.className="key present";else if(!k.classList.contains("correct")&&!k.classList.contains("present"))k.className="key wrong"}if(guess===answer){wins++;streak++;finish("You got it! The word was "+answer.toUpperCase()+".")}else{row++;current="";if(row===6){streak=0;finish("The word was "+answer.toUpperCase()+".")}}save()}
function finish(msg){gameOver=true;message.textContent=msg;document.getElementById("new").innerHTML='<button onclick="start()">New Word</button>';save()}
function save(){localStorage.ppWins=wins;localStorage.ppStreak=streak;document.getElementById("wins").textContent=wins;document.getElementById("streak").textContent=streak}
document.addEventListener("keydown",e=>{if(/^[a-zA-Z]$/.test(e.key))press(e.key.toUpperCase());else if(e.key==="Backspace")back();else if(e.key==="Enter")submit()});start();
</script>
</body></html>
