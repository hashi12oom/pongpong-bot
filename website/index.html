<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PongPong</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#fff;font-family:Arial,sans-serif}
.card{width:min(420px,90vw);padding:38px 28px;text-align:center;background:#1b1b1b;border:1px solid #303030;border-radius:18px}
.avatar{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;background:#292929;display:grid;place-items:center;font-size:34px;font-weight:700}
h1{margin:0 0 12px;font-size:28px}.status{display:inline-flex;align-items:center;gap:8px;color:#b7ffb7;font-size:16px}
.dot{width:10px;height:10px;border-radius:50%;background:#43d66b}
</style>
</head>
<body>
<main class="card">
  <div class="avatar">P</div>
  <h1>PongPong</h1>
  <div class="status"><span class="dot"></span>Online</div>
</main>
</body>
</html>
